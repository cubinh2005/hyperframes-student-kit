    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Seeded deterministic starfield (Exact code from claude-edit-intro Beat 5)
        const starsEl = document.querySelector('[data-composition-id="beat-4-takeaway"] .b4-stars');
        const STAR_COUNT = 40;
        const stars = [];
        if (starsEl) {
          for (let i = 0; i < STAR_COUNT; i++) {
            const el = document.createElement("div");
            el.className = "b4-star";
            const hx = Math.abs(Math.sin(i * 12.9898 + 78.233));
            const hy = Math.abs(Math.cos(i * 4.1414 + 23.456));
            const size = 1.5 + (Math.abs(Math.sin(i * 2.71)) * 3);
            el.style.left = (40 + hx * 1260) + "px";
            el.style.top = (40 + hy * 1000) + "px";
            el.style.width = size + "px";
            el.style.height = size + "px";
            el.style.opacity = (0.25 + Math.abs(Math.sin(i * 3.14)) * 0.55).toFixed(2);
            starsEl.appendChild(el);
            stars.push(el);
          }
        }

        // GSAP owns vertical center
        gsap.set('[data-composition-id="beat-4-takeaway"] .b4-panel', { yPercent: -50 });

        // Background crossfade & PiP halo
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-bg',
          { opacity: 0, duration: 0.50, ease: "power2.out" }, 0);
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-grid',
          { opacity: 0, duration: 0.80, ease: "power2.out" }, 0.10);
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-pip-halo',
          { opacity: 0, scale: 0.85, duration: 0.80, ease: "power3.out" }, 0.15);

        // Star drift
        stars.forEach((s, i) => {
          const dx = Math.sin(i * 0.9) * 20;
          const dy = -14 - Math.abs(Math.cos(i * 1.3)) * 10;
          gsap.to(s,
            { x: dx, y: dy, duration: 3.2, repeat: 2, yoyo: true,
              ease: "sine.inOut", delay: (i % 8) * 0.08 });
        });

        // Panel appears
        tl.to('[data-composition-id="beat-4-takeaway"] .b4-panel', { opacity: 1, duration: 0.01 }, 0.15);

        // Kicker entrance
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-kicker',
          { x: -20, opacity: 0, duration: 0.35, ease: "expo.out" }, 0.20);

        // Headline words stagger on cue:
        // "Cái mà mình muốn các bạn từ bỏ" @ master 17.82s -> local 0.22s
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-hl-1',
          { y: 50, opacity: 0, filter: "blur(12px)", duration: 0.60, ease: "power3.out" }, 0.30);
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-hl-2',
          { y: 50, opacity: 0, filter: "blur(16px)", scale: 0.94, duration: 0.65, ease: "power4.out" }, 0.50);

        // Divider wipes in
        tl.from('[data-composition-id="beat-4-takeaway"] .b4-divider',
          { scaleX: 0, transformOrigin: "left", duration: 0.45, ease: "expo.out" }, 0.90);

        // Habit 1: "tâm lý phó mặc" @ master 19.72s -> local 2.12s
        const span1 = document.querySelector('[data-composition-id="beat-4-takeaway"] #b4-habit-1 .b4-habit-text span');
        tl.to('[data-composition-id="beat-4-takeaway"] #b4-habit-1', { opacity: 1, duration: 0.01 }, 2.05);
        tl.from('[data-composition-id="beat-4-takeaway"] #b4-habit-1',
          { x: -20, duration: 0.35, ease: "power3.out" }, 2.05);
        if (span1) {
          tl.add(() => span1.classList.add("struck"), 2.45);
        }

        // Habit 2: "thói quen làm việc ăn may" @ master 20.58s -> local 2.98s
        const span2 = document.querySelector('[data-composition-id="beat-4-takeaway"] #b4-habit-2 .b4-habit-text span');
        tl.to('[data-composition-id="beat-4-takeaway"] #b4-habit-2', { opacity: 1, duration: 0.01 }, 2.90);
        tl.from('[data-composition-id="beat-4-takeaway"] #b4-habit-2',
          { x: -20, duration: 0.35, ease: "power3.out" }, 2.90);
        if (span2) {

        }

        // Outro CTA bar sweeps in at 3.55s and holds until end
        tl.to('[data-composition-id="beat-4-takeaway"] .b4-outro', { opacity: 1, duration: 0.01 }, 3.55);

          { opacity: 0, x: -14, duration: 0.40, ease: "expo.out" }, 3.65);

        // Duration anchor
        tl.to({}, { duration: 4.60 }, 0);
        window.__timelines["beat-4-takeaway"] = tl;
      })();
