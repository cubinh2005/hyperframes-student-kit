<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>AI Glass Explainer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="assets/brand-tokens.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07121c;
        font-family: var(--font-display, "Montserrat", sans-serif);
        color: #ffffff;
      }

      /* -------- Face-cam wrapper (Architecture from claude-edit-intro) --------
         Wrapper is a plain <div> animated by GSAP. Never animate dimensions on
         <video> directly (freezes video decoding in Chrome/HyperFrames).
         In Beats 1-3, wrapper is full-screen 1920x1080 with natural speaker.
         In Beat 4, wrapper smoothly shrinks to 540x960 9:16 PiP docked at x=1340, y=60. */
      #face-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        z-index: 0;
        background: #000;
        transition: border-radius 0.4s ease, box-shadow 0.4s ease;
      }

      #face-video {
        position: absolute;
        top: 0;
        left: 50%;
        height: 100%;
        width: auto;
        transform: translateX(-50%);
        display: block;
      }

      /* PiP mode styling (active during Beat 4) */
      #face-wrapper.pip {
        z-index: 10;
        border-radius: 36px;
        border: 1px solid rgba(55, 189, 248, 0.4);
        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset,
          0 0 60px rgba(55, 189, 248, 0.3);
      }

      .scene-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-7epf" id="root" data-composition-id="ai-glass-explainer" data-start="0" data-duration="22.20" data-width="1920" data-height="1080">
      <!-- Face video inside wrapper -->
      <div data-hf-id="hf-w3eg" id="face-wrapper">
        <video data-hf-id="hf-rht2" id="face-video" data-start="0" data-duration="22.20" data-track-index="0" src="assets/source.mp4" muted playsinline></video>
      </div>

      <!-- Sibling audio for playback & render mix -->
      <audio data-hf-id="hf-93m7" id="face-audio" data-start="0" data-duration="22.20" data-track-index="1" data-volume="1" src="assets/source.mp4"></audio>

      <!-- BEAT 1: Risk Alert (0.00s - 4.40s) -->
      <div data-hf-id="hf-7hne" id="beat-1" class="scene-layer" data-composition-id="beat-1-risk" data-composition-src="compositions/01-risk-alert.html" data-start="0" data-duration="4.40" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- BEAT 2: Community Query (7.10s - 15.30s) -->
      <div data-hf-id="hf-9ctm" id="beat-2" class="scene-layer" data-composition-id="beat-2-query" data-composition-src="compositions/02-community-query.html" data-start="7.10" data-duration="8.20" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- BEAT 3: Master Gauge (15.30s - 17.60s) -->
      <div data-hf-id="hf-ere7" id="beat-3" class="scene-layer" data-composition-id="beat-3-gauge" data-composition-src="compositions/04-master-gauge.html" data-start="15.30" data-duration="2.30" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- BEAT 4: Core Takeaway & PiP Mode (17.60s - 22.20s) -->
      <div data-hf-id="hf-94ef" id="beat-4" class="scene-layer" data-composition-id="beat-4-takeaway" data-composition-src="compositions/05-takeaway-pip.html" data-start="17.60" data-duration="4.60" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- KARAOKE SUBTITLES (0.00s - 22.20s on Track 3) -->
      <div data-hf-id="hf-b1s1" id="karaoke-track" class="scene-layer" data-composition-id="karaoke-captions" data-composition-src="compositions/03-karaoke-captions.html" data-start="0" data-duration="22.20" data-track-index="3" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });

      const FULL = { x: 0, y: 0, width: 1920, height: 1080 };
      const PIP  = { x: 1340, y: 60, width: 540, height: 960 };

      // Beats 1-3 start at FULL frame
      gsap.set("#face-wrapper", FULL);

      // Transition to PiP at 17.40s (0.2s before Beat 4 content lands)
      mainTl.to(
        "#face-wrapper",
        {
          ...PIP,
          duration: 0.65,
          ease: "power3.inOut",
          onStart: () => document.getElementById("face-wrapper").classList.add("pip")
        },
        17.35
      );

      // Ensure main timeline covers full 22.20s
      mainTl.to({}, { duration: 22.20 }, 0);
      window.__timelines["ai-glass-explainer"] = mainTl;
    </script>
  </body>
</html>
